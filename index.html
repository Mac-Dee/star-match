<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Match</title>
<style>
:root{--gold:#ffd86b;--pink:#ff7eb6;--lav:#d8c8ff;--ink:#14123d;--violet:#4b2a7a}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;color:#fff;background:linear-gradient(170deg,#14123d 0%,#2a1a5e 55%,#4b2a7a 100%) fixed;line-height:1.6;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;color:var(--gold);font-style:normal;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 4px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:bold;font-size:22px;color:var(--gold);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.lang{display:flex;border:1px solid rgba(255,216,107,.5);border-radius:20px;overflow:hidden}
.lang button{background:transparent;color:var(--lav);border:0;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.lang button[aria-pressed=true]{background:var(--gold);color:#2a1a5a;font-weight:bold}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hero{text-align:center;padding:22px 0 14px}
.hero .big{font-size:44px;color:var(--gold);line-height:1;text-shadow:0 0 24px rgba(255,216,107,.6)}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;margin:6px 0 4px}
.hero p{margin:0;color:var(--lav);font-size:15px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,216,107,.35);border-radius:20px;padding:20px;margin-top:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h2{margin:0 0 12px;font-size:14px;letter-spacing:3px;color:var(--gold);font-weight:600}
.row{display:grid;gap:14px}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
label{display:block;font-size:14px;color:var(--lav);margin-bottom:5px}
input[type=date]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid rgba(216,200,255,.5);background:rgba(10,8,40,.55);color:#fff;color-scheme:dark;min-height:46px}
.hint{font-size:12px;color:var(--lav);opacity:.8;margin-top:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:bold;font-size:16px;border:0;border-radius:26px;padding:13px 26px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.primary{background:var(--gold);color:#2a1a5a;box-shadow:0 4px 18px rgba(255,216,107,.35);flex:1 1 160px}
.primary:hover{box-shadow:0 6px 24px rgba(255,216,107,.55)}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);font-weight:600;font-size:14px;padding:11px 18px}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:#ffb3d3}
.msg.ok{color:#b8f0c8}
.center{text-align:center}
#loading{text-align:center;padding:34px 20px}
.orb{font-size:64px;animation:float 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(216,200,255,.7))}
@keyframes float{50%{transform:translateY(-8px) scale(1.06)}}
.lt{color:var(--gold);font-size:18px;margin:8px 0 14px;min-height:28px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);max-width:260px;margin:0 auto;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));border-radius:5px}
.cnt{font-size:48px;font-weight:bold;margin-top:12px;font-variant-numeric:tabular-nums}
.sub{font-size:14px;opacity:.75}
#result{text-align:center;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.signs{color:var(--gold);font-size:18px;font-weight:600}
.eyebrow{font-size:13px;letter-spacing:5px;color:var(--gold);margin-bottom:6px}
.ring{position:relative;width:190px;height:190px;margin:14px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.15)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(255,216,107,.7))}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:54px;font-weight:bold;line-height:1}
.ring .n small{font-size:26px}
.hearts{font-size:22px;letter-spacing:3px;margin:2px 0 4px}
.tier{font-size:20px;font-weight:bold;color:var(--pink)}
.comment{margin:10px auto 0;max-width:420px;font-size:16px}
.doki{margin:6px 0 0;color:var(--lav);font-size:14px}
.starter{margin-top:18px;text-align:left;background:rgba(255,255,255,.1);border:1px solid #f5c76a;border-radius:14px;padding:16px;font-size:16px}
.starter .t{color:#f5c76a;font-size:13px;margin-bottom:6px;font-weight:bold}
.starter .tip{margin-top:10px;font-size:13px;color:var(--lav);border-top:1px dashed rgba(255,255,255,.25);padding-top:8px}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(216,200,255,.4);border-radius:16px;padding:7px 12px;cursor:pointer}
.hist button b{color:var(--gold)}
.hist button:hover{background:rgba(255,255,255,.2)}
.empty{font-size:14px;color:var(--lav);opacity:.8}
[hidden]{display:none!important}
footer{text-align:center;font-size:12px;color:var(--lav);opacity:.7;margin-top:22px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
<i style="top:6%;left:8%;font-size:18px">✦</i><i style="top:12%;right:10%;font-size:14px;animation-delay:.8s">✦</i>
<i style="top:34%;left:4%;font-size:11px;animation-delay:1.6s">✦</i><i style="top:52%;right:5%;font-size:16px;animation-delay:2.2s">✦</i>
<i style="top:72%;left:12%;font-size:13px;animation-delay:1.1s">✦</i><i style="top:88%;right:16%;font-size:18px;animation-delay:.4s">✦</i>
</div>
<div class="wrap">
<header>
<div class="brand"><span aria-hidden="true">✦</span> Star Match</div>
<div class="lang" role="group" data-i18n-aria="langAria" data-demo="lang-switch">
<button type="button" id="l-ja" data-lang="ja" data-demo="lang-ja">日本語</button>
<button type="button" id="l-en" data-lang="en" data-demo="lang-en">EN</button>
</div>
</header>

<section class="hero">
<div class="big" aria-hidden="true">✦</div>
<h1>Star Match</h1>
<p data-i18n="tagline"></p>
</section>

<section class="card" id="formCard">
<h2 data-i18n="formTitle"></h2>
<div class="row">
<div><label for="dA" data-i18n="lblYou"></label><input type="date" id="dA" min="1900-01-01" data-demo="date-you"></div>
<div><label for="dB" data-i18n="lblCrush"></label><input type="date" id="dB" min="1900-01-01" data-demo="date-crush"></div>
</div>
<div class="btns">
<button class="btn ghost" type="button" id="sampleBtn" data-demo="sample-btn" data-i18n="sample"></button>
<button class="btn primary" type="button" id="goBtn" data-demo="go-btn" data-i18n="go"></button>
</div>
<div class="msg" id="msg" role="status" aria-live="polite" data-demo="message"></div>
<div class="hint" data-i18n="hint"></div>
</section>

<section class="card" id="loading" hidden data-demo="loading-area" aria-live="polite">
<div class="orb" aria-hidden="true">🔮</div>
<div class="lt" id="lt"></div>
<div class="bar"><div id="bf"></div></div>
<div class="cnt" id="cnt">0%</div>
<div class="sub" id="ls"></div>
</section>

<section class="card" id="result" hidden data-demo="result-area">
<div class="eyebrow">COMPATIBILITY</div>
<div class="signs" id="rSigns"></div>
<div class="ring">
<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="tr" cx="100" cy="100" r="88" fill="none" stroke-width="10"/><circle class="fg" id="rFg" cx="100" cy="100" r="88" fill="none" stroke-width="10" stroke-dasharray="552.92" stroke-dashoffset="552.92"/></svg>
<div class="num"><div class="n" id="rNum" data-demo="score">0<small>%</small></div></div>
</div>
<div class="hearts" id="rHearts" aria-hidden="true"></div>
<div class="tier" id="rTier"></div>
<p class="comment" id="rComment"></p>
<p class="doki" id="rDoki"></p>
<div class="starter" data-demo="starter-box">
<div class="t" data-i18n="starterTitle"></div>
<div id="rStarter"></div>
<div class="tip" id="rTip"></div>
</div>
<div class="btns" style="justify-content:center">
<button class="btn ghost" type="button" id="copyBtn" data-demo="copy-btn" data-i18n="copy"></button>
<button class="btn primary" type="button" id="againBtn" data-demo="again-btn" data-i18n="again" style="flex:0 1 auto"></button>
</div>
<div class="msg" id="msg2" role="status" aria-live="polite"></div>
</section>

<section class="card" id="histCard">
<h2 data-i18n="histTitle"></h2>
<div class="hist" id="hist" data-demo="history-list"></div>
<div class="btns" id="clearWrap"><button class="btn ghost" type="button" id="clearBtn" data-demo="clear-history" data-i18n="clear"></button></div>
</section>
<footer data-i18n="foot"></footer>
</div>

<script>
const I18N={

r1:"星を読み取り中…",r2:"ふたりの星が近づいています",r3:"運命の糸をたどっています…",starterTitle:"✨ 話しかけるきっかけ",copy:"一言をコピー",copied:"コピーしました！今日さっそく送ってみよう。",copyFail:"コピーできませんでした。文を長押ししてコピーしてね。",again:"もう一度占う",histTitle:"最近の占い",histEmpty:"まだ占いの履歴はありません。",clear:"履歴を消す",foot:"✦ 占いはエンターテインメントです。楽しむためのものです ✦",x:"×",tipPre:(s,t)=>`${s}の相手には「${t}」の話題が効くかも。`,
oneLine:"今日の一言"},

r1:"Reading the stars…",r2:"Your two stars are drawing closer",r3:"Following the thread of fate…",starterTitle:"✨ A way to start talking",copy:"Copy the line",copied:"Copied! Try sending it today.",copyFail:"Couldn't copy. Press and hold the text to copy it.",again:"Try again",histTitle:"Recent readings",histEmpty:"No readings yet.",clear:"Clear history",foot:"✦ Horoscopes are just for fun ✦",x:"×",tipPre:(s,t)=>`For a ${s}, try talking about: ${t}.`,
oneLine:"Today's line"}};

const SIGNS=[
{s:"♈",ja:"牡羊座",en:"Aries"},{s:"♉",ja:"牡牛座",en:"Taurus"},{s:"♊",ja:"双子座",en:"Gemini"},{s:"♋",ja:"蟹座",en:"Cancer"},
{s:"♌",ja:"獅子座",en:"Leo"},{s:"♍",ja:"乙女座",en:"Virgo"},{s:"♎",ja:"天秤座",en:"Libra"},{s:"♏",ja:"蠍座",en:"Scorpio"},
{s:"♐",ja:"射手座",en:"Sagittarius"},{s:"♑",ja:"山羊座",en:"Capricorn"},{s:"♒",ja:"水瓶座",en:"Aquarius"},{s:"♓",ja:"魚座",en:"Pisces"}];
const ELEM=['F','E','A','W'];
const BASE={FF:84,EE:80,AA:82,WW:85,AF:90,EW:88,EF:66,AW:64,FW:58,AE:62};
const TOPICS={
F:{ja:"運動・旅行・新しい挑戦",en:"sports, travel and new challenges"},
E:{ja:"グルメ・買い物・趣味",en:"food, shopping and hobbies"},
A:{ja:"音楽・本・SNS・最新ニュース",en:"music, books, social media and news"},
W:{ja:"映画・思い出・動物",en:"movies, memories and animals"}};
const COMBO={
FF:{ja:{c:"情熱と情熱が重なる、火花散るふたり！",s:["「最近いちばん燃えたことって何？」と聞いてみて。ふたりとも話が止まらなくなるかも。","「今度どこか行くなら、どこがいい？」とさらっと聞いてみて。"]},
 en:{c:"Two flames, one spark. Pure passion!",s:["Ask, \"What got you most fired up lately?\" You two might not stop talking.","Casually ask, \"If we went somewhere next, where would you pick?\""]}},
EE:{ja:{c:"安心感がじわじわ育つ、穏やかで心地いい相性。",s:["「おすすめのお店ってある？」と聞いてみて。次の約束につながりそう。","「休みの日はどんなふうに過ごしてる？」と聞いてみて。"]},
 en:{c:"A calm, cozy match where trust slowly grows.",s:["Ask, \"Any places you'd recommend?\" It could lead to a plan.","Ask, \"How do you like to spend your days off?\""]}},
AA:{ja:{c:"会話がポンポン弾む、風のようなふたり。",s:["「最近おもしろかった動画か本ある？」と聞いてみて。会話が止まらないはず。","「超能力をひとつもらえるなら何がいい？」と聞いてみて。盛り上がるよ。"]},
 en:{c:"Chats bounce back and forth like a breeze.",s:["Ask, \"Seen or read anything fun lately?\" The talk will keep flowing.","Ask, \"If you could have one superpower, what would it be?\""]}},
WW:{ja:{c:"言葉にしなくても通じ合える、深い絆の予感。",s:["「最近ほっとした瞬間ってあった？」と聞いてみて。心の距離がぐっと近づくよ。","「好きな映画、教えてくれない？」と聞いてみて。"]},
 en:{c:"You may understand each other without words.",s:["Ask, \"When did you feel most relaxed lately?\" You'll feel closer.","Ask, \"Could you tell me a movie you love?\""]}},
AF:{ja:{c:"風が炎をあおる、刺激いっぱいの相性！",s:["「最近ハマってることある？」と聞いてみて。意外な共通点が見つかるかも。","「今いちばん行きたい場所はどこ？」と聞いてみて。"]},
 en:{c:"Wind fans the flame. Full of exciting sparks!",s:["Ask, \"Got into anything new lately?\" You may find a surprise in common.","Ask, \"Where do you most want to go right now?\""]}},

 en:{c:"Like water nourishing the earth, you fill each other up.",s:["Ask, \"What's your favorite food?\" The chat will get warm.","Ask, \"Where do you feel most at ease?\""]}},

 en:{c:"Mind and heart, with a mysterious pull.",s:["Ask, \"Anything that made you think lately?\" A deep talk may begin.","Lightly ask, \"Are you a morning or night person?\""]}},
FW:{ja:{c:"熱と涙が混ざる、ドラマチックな相性。",s:["「最近、心に残った話ってある？」と聞いてみて。ぐっと距離が縮まるよ。","「好きな季節はいつ？」と聞いてみて。"]},

AE:{ja:{c:"発想と現実がかみ合えば最強のふたり。",s:["「最近買ってよかったものってある？」と聞いてみて。話が広がるよ。","「もし一日自由なら何する？」と聞いてみて。"]},
 en:{c:"Ideas plus reality make you a strong pair.",s:["Ask, \"What's the best thing you bought lately?\" The talk will grow.","Ask, \"If you had one free day, what would you do?\""]}}};
const TIERS=[
{min:90,ja:"💞 運命級の相性",en:"💞 A destined match",hn:5,dja:"心臓の音、聞こえちゃうかも…！",den:"Your heart may beat so loud they hear it!"},
{min:80,ja:"💕 相性バッチリ",en:"💕 A great match",hn:4,dja:"ふとした瞬間にドキッとする予感。",den:"Expect a little flutter when you least expect it."},
{min:70,ja:"💖 いい感じ",en:"💖 Looking good",hn:4,dja:"ちょっと話すだけで、気になる気持ちが育つかも。",den:"A short chat could make your feelings grow."},
{min:60,ja:"💗 これから伸びる",en:"💗 Room to grow",hn:3,dja:"ゆっくり近づくほど、じわっと好きになる関係。",den:"The slower you get closer, the sweeter it gets."},
{min:0,ja:"💓 ドキドキの伸びしろ",en:"💓 Full of surprises",hn:2,dja:"違いがあるから、知るたびにドキドキするはず。",den:"Your differences will keep surprising you."}];

let lang="en",state=null,timer=null,loadingKey=0;
const $=id=>document.getElementById(id);
const t=k=>I18N[lang][k];

function initLang(){
 let l=null;
 if(window.APP_LANG==="ja"||window.APP_LANG==="en")l=window.APP_LANG;
 if(!l){try{const q=new URLSearchParams(location.search).get("lang");if(q==="ja"||q==="en")l=q}catch(e){}}
 if(!l){try{const s=localStorage.getItem("lang");if(s==="ja"||s==="en")l=s}catch(e){}}
 lang=l||"en";
}
function setLang(l,save){
 lang=l;
 if(save){try{localStorage.setItem("lang",l)}catch(e){}}
 applyLang();
}
function applyLang(){
 document.documentElement.lang=lang;
 document.title=t("title");
 document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n)});
 document.querySelectorAll("[data-i18n-aria]").forEach(e=>{e.setAttribute("aria-label",t(e.dataset.i18nAria))});
 $("l-ja").setAttribute("aria-pressed",lang==="ja");
 $("l-en").setAttribute("aria-pressed",lang==="en");
 if(state)renderResult(false);
 if(!$("loading").hidden&&state)loadingText(state.stage||0);
 renderHistory();
}

function signOf(str){
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(str||"");
 if(!m)return -1;
 const v=(+m[2])*100+(+m[3]);
 if(v>=1222||v<=119)return 9;
 if(v<=218)return 10;
 if(v<=320)return 11;
 if(v<=419)return 0;
 if(v<=520)return 1;
 if(v<=621)return 2;
 if(v<=722)return 3;
 if(v<=822)return 4;
 if(v<=922)return 5;
 if(v<=1023)return 6;
 if(v<=1122)return 7;
 return 8;
}
function calc(a,b){
 const lo=Math.min(a,b),hi=Math.max(a,b);
 const ea=ELEM[a%4],eb=ELEM[b%4];
 const key=[ea,eb].sort().join("");
 const k=BASE[key]?key:key.split("").reverse().join("");
 let sc=BASE[k]+((lo*7+hi*13+lo*hi)%15)-7;
 if(hi-lo===6)sc+=5;
 if(hi===lo)sc+=3;
 sc=Math.max(42,Math.min(99,sc));
 return{score:sc,key:k,pick:(lo+hi)%2};
}
function tierOf(s){return TIERS.find(x=>s>=x.min)}

function show(id){["formCard","loading","result"].forEach(x=>{if(x!=="formCard")$(x).hidden=(x!==id)});}

function loadingText(stage){
 $("lt").textContent=t(stage===0?"r1":stage===1?"r3":"r1");
 $("ls").textContent=t(stage===0?"r2":stage===1?"r3":"r2");
 if(stage===1)$("lt").textContent=t("r1");
}
function go(){
 const da=$("dA").value,db=$("dB").value;
 const a=signOf(da),b=signOf(db);
 const msg=$("msg");msg.className="msg";
 if(a<0||b<0){msg.textContent=t("errEmpty");return}
 msg.textContent="";
 const r=calc(a,b);
 state={a,b,da,db,score:r.score,key:r.key,pick:r.pick,stage:0};
 saveHistory(da,db);
 startLoading();
}
function startLoading(){
 clearInterval(timer);
 $("result").hidden=true;$("loading").hidden=false;
 $("goBtn").disabled=true;
 const my=++loadingKey,dur=2800,t0=performance.now(),target=state.score;
 $("loading").scrollIntoView({behavior:"smooth",block:"center"});
 loadingText(0);
 function step(now){
  if(my!==loadingKey)return;
  let p=Math.min(1,(now-t0)/dur);
  const e=1-Math.pow(1-p,2);
  $("bf").style.width=(e*100)+"%";
  $("cnt").textContent=Math.round(e*target)+"%";
  const st=p<.4?0:p<.75?1:2;
  if(st!==state.stage){state.stage=st;loadingText(st)}
  if(p<1)requestAnimationFrame(step);else finish();
 }
 requestAnimationFrame(step);
}
function finish(){
 $("goBtn").disabled=false;
 $("loading").hidden=true;
 $("result").hidden=false;
 renderResult(true);
 $("result").scrollIntoView({behavior:"smooth",block:"start"});
 renderHistory();
}
function renderResult(animate){
 if(!state)return;
 const A=SIGNS[state.a],B=SIGNS[state.b],c=COMBO[state.key][lang],tr=tierOf(state.score);
 $("rSigns").textContent=`${A.s} ${A[lang]} ${t("x")} ${B.s} ${B[lang]}`;
 $("rNum").innerHTML=state.score+"<small>%</small>";
 $("rHearts").textContent="❤".repeat(tr.hn)+"🤍".repeat(5-tr.hn);
 $("rTier").textContent=tr[lang];
 $("rComment").textContent=c.c;
 $("rDoki").textContent=lang==="ja"?tr.dja:tr.den;
 $("rStarter").textContent=c.s[state.pick];
 $("rTip").textContent=t("tipPre")(B[lang],TOPICS[ELEM[state.b%4]][lang]);
 const circ=552.92,fg=$("rFg");
 if(animate){
  fg.style.transition="none";fg.style.strokeDashoffset=circ;
  void fg.getBoundingClientRect();
  fg.style.transition="";
  requestAnimationFrame(()=>{fg.style.strokeDashoffset=circ*(1-state.score/100)});
 }else{fg.style.strokeDashoffset=circ*(1-state.score/100)}
}

function loadHist(){try{const v=JSON.parse(localStorage.getItem("sm_hist")||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveHistory(a,b){
 let h=loadHist().filter(x=>!(x.a===a&&x.b===b));
 h.unshift({a,b});h=h.slice(0,5);
 try{localStorage.setItem("sm_hist",JSON.stringify(h))}catch(e){mem=h}
}
let mem=null;
function renderHistory(){
 const box=$("hist");box.innerHTML="";
 let h=loadHist();if(!h.length&&mem)h=mem;
 h=h.filter(x=>signOf(x.a)>=0&&signOf(x.b)>=0);
 $("clearWrap").hidden=!h.length;
 if(!h.length){const d=document.createElement("div");d.className="empty";d.textContent=t("histEmpty");box.appendChild(d);return}
 h.forEach(x=>{
  const a=signOf(x.a),b=signOf(x.b),r=calc(a,b);
  const btn=document.createElement("button");btn.type="button";btn.dataset.demo="history-item";
  btn.innerHTML=`${SIGNS[a].s} ${t("x")} ${SIGNS[b].s} <b>${r.score}%</b>`;
  btn.setAttribute("aria-label",`${SIGNS[a][lang]} ${t("x")} ${SIGNS[b][lang]} ${r.score}%`);
  btn.onclick=()=>{
   $("dA").value=x.a;$("dB").value=x.b;
   state={a,b,da:x.a,db:x.b,score:r.score,key:r.key,pick:r.pick,stage:0};
   loadingKey++;$("loading").hidden=true;$("goBtn").disabled=false;
   $("result").hidden=false;renderResult(true);
   $("result").scrollIntoView({behavior:"smooth",block:"start"});
  };
  box.appendChild(btn);
 });
}

function copyText(){
 const txt=$("rStarter").textContent,m=$("msg2");
 const ok=()=>{m.className="msg ok";m.textContent=t("copied")};
 const fail=()=>{m.className="msg";m.textContent=t("copyFail")};
 const legacy=()=>{
  try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const r=document.execCommand("copy");document.body.removeChild(ta);r?ok():fail()}catch(e){fail()}
 };
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,legacy);else legacy();
 }catch(e){legacy()}
}

$("goBtn").onclick=go;
$("sampleBtn").onclick=()=>{$("dA").value="1995-04-05";$("dB").value="1996-08-27";$("msg").textContent=""};
$("againBtn").onclick=()=>{
 state=null;loadingKey++;$("result").hidden=true;$("msg2").textContent="";
 $("dA").value="";$("dB").value="";
 $("formCard").scrollIntoView({behavior:"smooth",block:"start"});$("dA").focus();
};
$("copyBtn").onclick=copyText;
$("clearBtn").onclick=()=>{try{localStorage.removeItem("sm_hist")}catch(e){}mem=null;renderHistory()};
$("l-ja").onclick=()=>setLang("ja",true);
$("l-en").onclick=()=>setLang("en",true);
["dA","dB"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")go()}));

initLang();
applyLang();
</script>
</body>
